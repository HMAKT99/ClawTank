[workspace]
resolver = "3"
members = ["clawtank-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/clawtank/clawtank"
rust-version = "1.88"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Keep debug builds small: full debug info for our crate only, none for dependencies.
[profile.dev]
debug = "line-tables-only"
# Incremental caches grow without bound across edits; full rebuilds of our one crate are fast.
incremental = false

[profile.dev.package."*"]
debug = false
