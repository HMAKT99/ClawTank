language = "C"
include_guard = "CLAWTANK_CORE_H"
autogen_warning = "/* Generated by cbindgen from core/clawtank-core/src/ffi.rs. Do not edit. */"
header = "/* SPDX-License-Identifier: Apache-2.0 */"
include_version = false
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]
no_includes = true
cpp_compat = true
usize_is_size_t = true
style = "type"

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[export]
include = ["CtStatus", "CtSubmitResult", "CtVideoStats"]
