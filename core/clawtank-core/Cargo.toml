[package]
name = "clawtank-core"
description = "ClawTank RDP protocol core (IronRDP) exposed to the Swift host via a C ABI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# Exact pins for IronRDP: see docs/research/ironrdp.md. Bump deliberately, never implicitly.
ironrdp-server = { version = "=0.13.0", default-features = false, features = ["egfx"] }
ironrdp-cliprdr = "=0.7.0"
ironrdp-core = "=0.2.1"
ironrdp-displaycontrol = "=0.8.0"
ironrdp-dvc = "=0.8.0"
ironrdp-egfx = "=0.3.0"
ironrdp-pdu = "=0.9.0"
ironrdp-rdpsnd = "=0.9.0"
ironrdp-svc = "=0.8.0"
anyhow = "1" # ironrdp-server 0.13 trait signatures use anyhow::Result
async-trait = "0.1"
bytes = "1"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "crypto"] }
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
# Client side of the integration test (tests/connect.rs): IronRDP's own client stack.
ironrdp-async = "=0.10.0"
ironrdp-connector = "=0.10.0"
ironrdp-graphics = "=0.9.0"
ironrdp-session = "=0.11.0"
ironrdp-tokio = { version = "=0.10.0", features = ["reqwest"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }
