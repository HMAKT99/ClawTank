name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install tools
        run: brew install xcodegen swiftlint
      - name: Lint
        run: make lint
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Package (unsigned)
        run: make package
      - uses: actions/upload-artifact@v7
        with:
          name: ClawTank-dmg
          path: dist/*

  freerdp-interop:
    # The core is portable Rust, so the independent-client check runs on Linux with FreeRDP 3.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install FreeRDP and Xvfb
        run: sudo apt-get update && sudo apt-get install -y freerdp3-x11 xvfb
      - name: Build test server
        run: cd core && cargo build --example testserver
      - name: FreeRDP smoke test
        run: tests/freerdp-smoke.sh core/target/debug/examples/testserver

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cd core && cargo audit
